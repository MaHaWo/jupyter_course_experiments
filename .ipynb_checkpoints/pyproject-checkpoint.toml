[project]
name = "jupyter-ssc-compact-course"
version = "0.1.0"
description = "Materials for the 'Sustainable development with jupyter notebooks' SSC compact course"
requires-python = ">=3.14"
readme = "README.md"
dependencies = [
    "h5py>=3.16.0",
    "ipykernel>=7.4.0",
    "juliacall>=0.9.37",
    "jupyter-contrib-nbextensions>=0.7.0",
    "jupyter-resource-usage>=1.3.1",
    "jupyterlab>=4.6.6",
    "jupyterlab-ai-code-assistants-extension>=1.3.33",
    "jupyterlab-execute-time>=3.3.0",
    "jupyterlab-git>=0.55.0",
    "jupyterlab-nvdashboard>=0.15.0",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "polars>=2.1.0",
    "pyarrow>=26.0.1",
    "seaborn>=0.13.2",

]

[project.optional-dependencies]
torch = ["lightning>=2.6.6", "torch>=2.15.0", "torchvision>=0.29.2"]
tests = [
    "coverage>=7.17.5",
    "hypothesis>=6.170.17",
    "pytest>=9.2.0",
]
